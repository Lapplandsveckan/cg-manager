[package]
name = "cg-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
